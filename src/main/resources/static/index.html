<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workspace-watcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>workspace&#8203;-watcher</h1>
  <div class="meta">
    <span id="workspace">connecting…</span>
    <span id="branch" class="pill"></span>
    <span id="conn" class="pill dim">offline</span>
  </div>
</header>

<main>
  <section class="panel" id="panel-processes">
    <h2>Processes in workspace <span class="note" title="Sampled every 2s via lsof. Short-lived commands are missed by design — trust the activity feed for a complete record.">sampled</span></h2>
    <div class="body" id="processes"><p class="empty">no processes with a working directory inside this workspace</p></div>
  </section>

  <section class="panel" id="panel-feed">
    <h2>Activity
      <span class="filters">
        <label><input type="checkbox" data-source="TRANSCRIPT" checked> agent</label>
        <label><input type="checkbox" data-source="HOOK" checked> hooks</label>
        <label><input type="checkbox" data-source="FS" checked> files</label>
        <label><input type="checkbox" data-source="GIT"> git</label>
        <label><input type="checkbox" data-source="PROCESS"> proc</label>
      </span>
    </h2>
    <div class="body" id="feed"></div>
  </section>

  <section class="panel" id="panel-git">
    <h2>Working tree <span id="git-summary" class="note"></span></h2>
    <div class="body" id="git"><p class="empty">no changes</p></div>
  </section>

  <section class="panel" id="panel-diff">
    <h2>Diff <span id="diff-path" class="note"></span></h2>
    <div class="body" id="diff"><p class="empty">select a file in the working tree</p></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
