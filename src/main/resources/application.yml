server:
  # Loopback only. This dashboard exposes source diffs and command lines; reach a remote
  # instance through an SSH tunnel or a private overlay network, never an open port.
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: workspace-watcher
  web:
    resources:
      cache:
        cachecontrol:
          # The asset filenames carry a content hash, so they can be cached hard. index.html
          # cannot: it is what points at those filenames, and a browser holding an old copy keeps
          # loading an old bundle long after a rebuild - which looks exactly like a broken feature.
          max-age: 31536000
          cache-public: true
  graphql:
    # GraphQL is the whole API: queries over HTTP POST, the live feed over a graphql-ws
    # subscription. There is no REST surface.
    path: /graphql
    websocket:
      path: /graphql
    graphiql:
      # Schema explorer at http://127.0.0.1:8080/graphiql - safe here because the app is
      # loopback-only, but reconsider if that ever changes.
      enabled: true
    schema:
      printer:
        enabled: true

  task:
    scheduling:
      pool:
        # Eight @Scheduled collectors, and the default is one thread for all of them. That puts the
        # hook spool drain, whose whole point is to be prompt, in a queue behind a filesystem walk
        # that paces itself on the assumption that it is not queued behind anything.
        size: 4

watcher:
  # Empty means discover it: the watcher waits for an agent hook to say which project is being
  # worked in, and otherwise reinstates whichever workspace was chosen last. Set this, or pass
  # --watcher.workspace=/path/to/project, to pin it to one instead.
  workspace: ""
  claude-home: ${user.home}/.claude
  fs-poll-ms: 750
  transcript-poll-ms: 500
  # Hooks spool here; must match WORKSPACE_WATCHER_SPOOL in hooks/workspace-watcher-hook.sh
  spool: ${user.home}/.claude/workspace-watcher-spool
  spool-poll-ms: 200
  # Recorded history. Set database to an empty value to run without it.
  database: ${user.home}/.claude/workspace-watcher/events.db
  history-flush-ms: 500
  retention-days: 30
  process-poll-ms: 2000
  history-size: 2000

# DGS loads its own schema and defaults to classpath:schema/**, while Spring Boot and the codegen
# plugin both use classpath:graphql/**. Point DGS at the same single file so there is exactly one
# copy of the contract.
dgs:
  graphql:
    schema-locations: classpath*:graphql/**/*.graphql*

logging:
  level:
    be.kleisli.ww: INFO
